[package]
name = "morningstar_model"
version = "2.0.0"
edition = "2021"

[dependencies]
jiff = { version = "0.2.35", default-features = false, features = ["serde", "std"] }
bitflags = { version = "2.13.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
multimap = "0.10.1"

[dev-dependencies]
ron = "0.12.2"
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
strip = true
