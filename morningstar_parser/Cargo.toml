[package]
name = "morningstar_parser"
version = "2.0.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", default-features = false }
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
gtfs-structures = "0.41.3"
ron = "0.12.2"
spinoff = "0.8.0"
unidecode = "0.3.0"
morningstar_model = { path = "../morningstar_model" }
clap = { version = "4.6.6", features = ["derive"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
strip = true
