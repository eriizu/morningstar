[package]
name = "morningstar_rt"
version = "0.1.0"
edition = "2024"
default-run = "morningstar_rt"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
jiff = { version = "0.2.35", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["query"] }
dotenvy = "0.15.7"
morningstar_model = { path = "../morningstar_model" }
clap = { version = "4.6.6", features = ["derive"] }
ron = "0.12.2"
poem = "3.1.12"
thiserror = "2.0.20"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
strip = true
