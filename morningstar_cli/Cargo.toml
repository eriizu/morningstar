[package]
name = "morningstar_cli"
version = "1.0.0"
edition = "2021"

[dependencies]
morningstar_model = { path = "../morningstar_model" }
jiff = "0.2.35"
clap = { version = "4.6.6", features = ["derive"] }
inquire = "0.9.4"
fuse-rust = "0.4.0"
ron = "0.12.2"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
strip = true
